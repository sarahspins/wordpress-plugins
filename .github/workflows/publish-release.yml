name: Publish WordPress release

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: "Release version to publish (for example 1.0 or 2.0). Leave blank to increment the latest minor version."
        required: false
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build component packages and update manifest
        run: python3 .github/scripts/build_release.py

      - name: Verify packages
        run: |
          for package in dist/*.zip; do
            unzip -t "$package"
          done

      - name: Choose release version and tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${{ inputs.release_version }}"
          version="${version#release-}"

          if [ -z "$version" ]; then
            latest_version="$(gh release list --repo "${{ github.repository }}" --limit 100 --json tagName --jq '.[].tagName' | sed -n 's/^release-\([0-9]\+\.[0-9]\+\)$/\1/p' | sort -V | tail -n 1)"
            if [ -z "$latest_version" ]; then
              version="1.0"
            else
              major="${latest_version%%.*}"
              minor="${latest_version#*.}"
              version="${major}.$((minor + 1))"
            fi
          fi

          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]; then
            echo "Invalid release version: $version" >&2
            exit 1
          fi

          if gh release view "release-$version" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "Release $version already exists." >&2
            exit 1
          fi

          echo "RELEASE_VERSION=$version" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=release-$version" >> "$GITHUB_ENV"

      - name: Publish private release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$RELEASE_TAG" dist/* \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "Ice & Field WordPress Release ${RELEASE_VERSION}" \
            --notes "Private WordPress update packages built from commit ${{ github.sha }}."
